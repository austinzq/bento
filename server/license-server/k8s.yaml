# bento 许可服务器：devops 命名空间，Traefik IngressRoute，内网 lic.yun.local / 公网 lic.zcpz.cc
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: bento-license-data, namespace: devops }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: bento-license, namespace: devops }
spec:
  replicas: 1
  strategy: { type: Recreate }   # 单副本 + RWO 卷：先停旧的再起新的，否则新旧 pod 抢同一块卷
  selector: { matchLabels: { app: bento-license } }
  template:
    metadata: { labels: { app: bento-license } }
    spec:
      # n3 的 Longhorn 卷格式化失败（节点缺 mkfs.ext4），避开它
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: NotIn, values: [n3] }
      containers:
        - name: app
          image: registry.yun.local/devops/bento-license:20260907b
          ports: [{ containerPort: 8080 }]
          env:
            - { name: LICENSE_DB, value: /data/licenses.json }
            - name: ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: bento-license-admin, key: token } }
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: bento-license-data }
---
apiVersion: v1
kind: Service
metadata: { name: bento-license, namespace: devops }
spec: { selector: { app: bento-license }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: bento-license, namespace: devops }
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`lic.yun.local`) || Host(`lic.zcpz.cc`)
      services: [{ name: bento-license, port: 80 }]
